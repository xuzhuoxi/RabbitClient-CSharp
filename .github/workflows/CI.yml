# 构建、测试与覆盖率流程见同目录 CI.md
name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  INFRA_REPO: xuzhuoxi/Infra-CSharp

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RabbitClient-CSharp
    outputs:
      has_coverage: ${{ steps.cov.outputs.has_coverage }}
    steps:
      # 本仓库 csproj 以旁路目录引用 Infra-CSharp（../../Infra-CSharp/...），
      # 须把两个仓库检出为 github.workspace 下的兄弟目录。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: RabbitClient-CSharp
      # CI 读 Require.yml 的 Default.Infra-CSharp：last / v*.*.* / 提交短哈希
      - name: Resolve Infra-CSharp ref
        id: infra_ref
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/resolve-infra-ref.py Require.yml --default
      # 不用 actions/checkout 拉 Infra：不写 token 仍会用本仓库 GITHUB_TOKEN，
      # 私有仓库用它去拉其它公开仓库会 404。匿名 git clone，并去掉 extraheader。
      - name: Checkout Infra-CSharp
        env:
          INFRA_REF: ${{ steps.infra_ref.outputs.ref }}
          INFRA_KIND: ${{ steps.infra_ref.outputs.kind }}
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/Infra-CSharp"
          url="https://github.com/${INFRA_REPO}.git"
          ref="${INFRA_REF}"
          kind="${INFRA_KIND:-}"
          export GIT_TERMINAL_PROMPT=0
          rm -rf "${dest}"
          git_anon=(git -c "http.https://github.com/.extraheader=")
          if [[ "${kind}" == "sha" ]]; then
            "${git_anon[@]}" clone --filter=blob:none "${url}" "${dest}"
            "${git_anon[@]}" -C "${dest}" checkout "${ref}"
          else
            "${git_anon[@]}" clone --depth 1 --branch "${ref}" "${url}" "${dest}"
          fi
          echo "Checked out Infra-CSharp at ${ref} (kind=${kind:-tag})"
          git -C "${dest}" log -1 --oneline
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Run build
        run: dotnet build RabbitClient-CSharp.sln --configuration Release
      - name: Run test with coverage
        # Category=RunOnlyThis 的用例依赖本机 Rabbit-Home（HTTP 9000）及 Rabbit-Server，CI 中跳过。
        run: |
          set -euo pipefail
          dotnet test RabbitClient-Test/RabbitClient-Test.csproj \
            --configuration Release \
            --no-build \
            --filter "Category!=RunOnlyThis" \
            --collect:"XPlat Code Coverage" \
            --results-directory "${GITHUB_WORKSPACE}/coverage" \
            --blame-hang-timeout 5m \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          cov="$(find "${GITHUB_WORKSPACE}/coverage" -name 'coverage.cobertura.xml' 2>/dev/null | head -n 1 || true)"
          if [[ -n "${cov}" ]]; then
            cp "${cov}" "${GITHUB_WORKSPACE}/coverage.cobertura.xml"
          fi
      - name: Record coverage presence
        id: cov
        run: |
          if [[ -f "${GITHUB_WORKSPACE}/coverage.cobertura.xml" ]]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ${{ github.workspace }}
      - name: Upload coverage artifact
        if: steps.cov.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.cobertura.xml

  upload-coverage:
    name: Upload coverage
    needs: build-and-test
    if: needs.build-and-test.outputs.has_coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.cobertura.xml
          fail_ci_if_error: false
